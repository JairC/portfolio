<!-- @dsCard group="Components" viewport="700x300" name="Core" subtitle="Button, Eyebrow, CategoryChip, MetricStat, PlaceholderSlot, Rule", -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.grp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;padding:16px 32px;font-size:11px;line-height:16px;letter-spacing:.008em}
</style></head>
<body>
<div class="stack">
<div class="grp">
<span class="btn" style="background:var(--button-fill);color:var(--text-inverse)">CONTACT →</span>
<span class="btn" style="box-shadow:inset 0 0 0 1px var(--border-button)">DOWNLOAD CV ↓</span>
<span class="btn" style="background:var(--button-fill-hover);color:var(--text-inverse)">HOVER</span>
<span style="font-size:11px;color:var(--text-muted)">QUIET LINK</span>
</div>
<div class="grp">
<span style="font-size:9px;letter-spacing:.08em;color:var(--text-accent)">FEATURED — 01</span>
<span style="font-size:10px;letter-spacing:.06em;color:var(--text-meta)">02 — BRAND · PRODUCT</span>
<span style="display:inline-flex;padding:8px 16px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-hairline);font-size:11px">FINTECH · WALLET</span>
<span style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface-tint);color:var(--verdigris);font-size:11px"><span style="width:6px;height:6px;border-radius:50%;background:var(--verdigris)"></span>TINT CHIP</span>
</div>
<div class="grp" style="gap:40px;align-items:flex-end">
<div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-display);font-weight:300;font-size:52px;line-height:52px;letter-spacing:-.02em;color:var(--text-stat)">81.8% → 85.1%</span><span class="k">TRANSACTION SUCCESS</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-display);font-weight:300;font-size:34px;line-height:34px;color:var(--text-meta);border:1px dashed var(--border-dashed);padding:0 10px">TBD</span><span class="k">PENDING</span></div>
</div>
<div style="border:1px dashed var(--border-dashed);padding:14px;font-size:11px;line-height:20px;color:var(--text-meta)">BODY COPY PLACEHOLDER — 40 to 60 words.</div>
<div style="height:1px;background:var(--border-hairline)"></div>
</div>
</body>
</html>
