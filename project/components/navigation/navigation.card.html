<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.grp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;padding:16px 32px;font-size:11px;line-height:16px;letter-spacing:.008em}
</style></head>
<body>
<div class="stack" style="gap:0">
<div style="display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border-hairline)">
<span style="font-weight:700;font-size:13px">papi(r)</span>
<div style="display:flex;gap:32px;font-size:11px;letter-spacing:.008em;color:var(--text-muted)"><span style="color:var(--text-primary)">PROJECTS</span><span>ABOUT</span><span>CONTACT</span></div>
</div>
<div style="background:var(--surface-inverse);display:flex;justify-content:space-between;padding:28px 24px;margin-top:24px">
<div style="display:flex;flex-direction:column;gap:8px;font-size:12px"><span style="color:var(--text-inverse-muted)">CONTACT</span><span style="color:var(--text-inverse)">hi@yourname.com</span><span style="color:var(--text-inverse)">+52 33 0000 0000</span></div>
<div style="display:flex;flex-direction:column;gap:8px;font-size:12px"><span style="color:var(--text-inverse-muted)">WORK</span><span style="color:var(--text-inverse)">Projects</span><span style="color:var(--text-inverse)">Case Studies</span></div>
<div style="display:flex;flex-direction:column;gap:8px;font-size:12px"><span style="color:var(--text-inverse-muted)">SOCIAL</span><span style="color:var(--text-inverse)">LinkedIn</span><span style="color:var(--text-inverse)">Behance</span></div>
<span style="font-size:12px;color:var(--text-meta)">(c) 2026 Your Name</span>
</div>
</div>
</body>
</html>
