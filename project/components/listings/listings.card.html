<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.grp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;padding:16px 32px;font-size:11px;line-height:16px;letter-spacing:.008em}
</style></head>
<body>
<div class="stack">
<div>
<div style="height:120px;background:var(--surface-image);position:relative"><span style="position:absolute;left:14px;top:14px;padding:7px 14px;background:var(--surface-card);font-size:10px">FINTECH · WALLET</span></div>
<div style="display:flex;flex-direction:column;gap:10px;padding-top:16px">
<span style="font-size:9px;letter-spacing:.08em;color:var(--text-accent)">FEATURED — 01</span>
<span style="font-family:var(--font-display);font-weight:300;font-size:34px;line-height:36px;letter-spacing:-.025em">cashi_bill_payments</span>
<div style="display:flex;align-items:baseline;gap:14px"><span style="font-family:var(--font-display);font-weight:300;font-size:34px;line-height:34px;letter-spacing:-.02em;color:var(--text-stat)">81.8% → 85.1%</span><span class="k">TRANSACTION SUCCESS</span></div>
</div>
</div>
<div style="height:1px;background:var(--border-hairline)"></div>
<div style="display:flex;gap:32px;align-items:center;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:10px;flex-grow:1">
<span style="font-size:10px;letter-spacing:.06em;color:var(--text-meta)">02 — BRAND · PRODUCT</span>
<span style="font-family:var(--font-display);font-weight:300;font-size:28px;line-height:32px;letter-spacing:-.025em">cashi_rebrand</span>
<span style="font-family:var(--font-display);font-weight:300;font-size:16px;line-height:24px;color:var(--text-muted)">A full IA rebuild that cut support tickets in half.</span>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-display);font-weight:300;font-size:26px;line-height:26px;color:var(--text-stat)">700K+</span><span class="k">INSTALLS</span></div>
</div>
<div style="width:180px;height:115px;background:var(--surface-image);flex-shrink:0"></div>
</div>
<div style="height:1px;background:var(--border-hairline)"></div>
</div>
</body>
</html>
