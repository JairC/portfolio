<!-- @dsCard group="Components" viewport="700x400" name="Sections" subtitle="HeroStatement, ChapterBlock, ResultsBand, NextProjectBand, ContactBand, MetaGrid" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.grp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;padding:16px 32px;font-size:11px;line-height:16px;letter-spacing:.008em}
</style></head>
<body>
<div class="stack" style="gap:22px">
<div style="font-family:var(--font-display);font-weight:300;font-size:40px;line-height:42px;letter-spacing:-.03em">Strategy first.<br>Then design <em style="font-style:italic;font-weight:400">that works</em>.</div>
<div style="display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:10px;line-height:16px;color:var(--text-meta);padding-top:16px;border-top:1px solid var(--border-hairline)"><span>ROLE</span><span style="color:var(--text-primary)">PRODUCT DESIGN / UX</span><span>BASE</span><span style="border:1px dashed var(--border-dashed);padding:1px 6px;justify-self:start">TBD</span></div>
<div style="display:flex;gap:40px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:4px;width:90px;flex-shrink:0"><span style="font-family:var(--font-display);font-size:12px;color:var(--text-accent)">01</span><span style="font-size:10px;color:var(--text-meta)">CONTEXT</span></div>
<div style="font-family:var(--font-display);font-weight:300;font-size:26px;line-height:30px;letter-spacing:-.025em">Chapter heading</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;align-items:center;padding:22px 0;border-top:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)">
<span style="font-weight:700;font-size:12px;color:var(--text-meta)">RESULTS</span>
<span style="font-family:var(--font-display);font-weight:300;font-size:36px;line-height:38px;letter-spacing:-.02em;color:var(--text-stat)">700K+ installs</span>
</div>
<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11px;color:var(--text-meta)">NEXT PROJECT</span><span style="font-family:var(--font-display);font-weight:300;font-size:34px;line-height:36px;letter-spacing:-.025em">ircode_admin_panel <span style="color:var(--text-accent)">→</span></span></div>
<div style="width:150px;height:88px;background:var(--surface-image)"></div>
</div>
<div style="display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:20px;border-top:1px solid var(--border-hairline)">
<span style="font-family:var(--font-display);font-weight:300;font-size:34px;line-height:36px;letter-spacing:-.025em">Let us work together</span>
<span class="btn" style="box-shadow:inset 0 0 0 1px var(--border-button)">GET IN TOUCH →</span>
</div>
</div>
</body>
</html>
