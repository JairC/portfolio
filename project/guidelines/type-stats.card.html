<!-- @dsCard group="Type" viewport="700x160" name="Stats" subtitle="Fraunces 300 in verdigris, mono caption beneath" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div style="display:flex;gap:48px;align-items:flex-end">
<div style="display:flex;align-items:baseline;gap:16px"><span style="font-family:var(--font-display);font-optical-sizing:auto;font-weight:300;font-size:52px;line-height:52px;letter-spacing:-.02em;color:var(--text-stat)">81.8% → 85.1%</span><span class="k">TRANSACTION SUCCESS</span></div>
<div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-display);font-weight:300;font-size:34px;line-height:34px;letter-spacing:-.02em;color:var(--text-stat)">700K+</span><span class="k">INSTALLS</span></div>
</div>
</body>
</html>
