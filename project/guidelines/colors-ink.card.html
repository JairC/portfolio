<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Text hierarchy: primary, muted, meta" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--ink);"></div><div class="k">INK</div><div class="v">--ink<br>#0E0E0C</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-70);"></div><div class="k">INK 70</div><div class="v">--ink-70<br>#6A6A64</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-45);"></div><div class="k">INK 45</div><div class="v">--ink-45<br>#9A9994</div></div>
</div>
</body>
</html>
