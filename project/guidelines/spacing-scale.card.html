<!-- @dsCard group="Spacing" viewport="700x150" name="Scale" subtitle="4 to 120, four-based with editorial jumps" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div class="row" style="align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:4px;height:4px;background:var(--surface-image)"></div><span class="v">4</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:8px;height:8px;background:var(--surface-image)"></div><span class="v">8</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:12px;height:12px;background:var(--surface-image)"></div><span class="v">12</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:16px;height:16px;background:var(--surface-image)"></div><span class="v">16</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:24px;height:24px;background:var(--surface-image)"></div><span class="v">24</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:32px;height:32px;background:var(--surface-image)"></div><span class="v">32</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:40px;height:40px;background:var(--surface-image)"></div><span class="v">40</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:56px;height:56px;background:var(--surface-image)"></div><span class="v">56</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:80px;height:80px;background:var(--surface-image)"></div><span class="v">80</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:100px;height:100px;background:var(--surface-image)"></div><span class="v">100</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:120px;height:120px;background:var(--surface-image)"></div><span class="v">120</span></div>
</div>
</body>
</html>
