<!-- @dsCard group="Colors" viewport="700x150" name="Accents" subtitle="Verdigris carries stats, red carries direction" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--verdigris);"></div><div class="k">VERDIGRIS</div><div class="v">--verdigris<br>#4A7668</div></div>
<div class="sw"><div class="chip" style="background:var(--verdigris-tint);box-shadow:inset 0 0 0 1px rgba(14,14,12,.08)"></div><div class="k">VERDIGRIS TINT</div><div class="v">--verdigris-tint<br>#CDE0DB</div></div>
<div class="sw"><div class="chip" style="background:var(--red);"></div><div class="k">RED</div><div class="v">--red<br>#C0392B</div></div>
</div>
</body>
</html>
