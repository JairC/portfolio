<!-- @dsCard group="Brand" viewport="700x170" name="States" subtitle="Links go red, bands shade, primary fill flips to red" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:12px;font-size:11px;line-height:16px">
<div style="display:flex;gap:24px"><span>LINK DEFAULT</span><span style="color:var(--text-accent)">LINK HOVER</span></div>
<div style="display:flex;gap:12px">
<span style="padding:12px 24px;background:var(--button-fill);color:var(--text-inverse)">CONTACT →</span>
<span style="padding:12px 24px;background:var(--button-fill-hover);color:var(--text-inverse)">CONTACT → (HOVER)</span>
<span style="padding:12px 24px;box-shadow:inset 0 0 0 1px var(--border-button)">DOWNLOAD CV ↓</span>
</div>
<div style="display:flex;gap:12px"><span style="padding:10px 18px;background:var(--surface-card);border:1px solid var(--border-hairline)">BAND DEFAULT</span><span style="padding:10px 18px;background:var(--surface-hover);border:1px solid var(--border-hairline)">BAND HOVER</span></div>
</div>
</body>
</html>
