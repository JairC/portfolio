<!-- @dsCard group="Colors" viewport="700x150" name="Lines" subtitle="Hairline rules and dashed placeholder borders" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div style="display:flex;flex-direction:column;gap:18px">
<div><div class="k" style="margin-bottom:8px">--line · #DDDBD7 · 1px hairline</div><div style="height:1px;background:var(--border-hairline)"></div></div>
<div><div class="k" style="margin-bottom:8px">--line-strong · #C8C5C0 · dashed placeholder + button border</div><div style="height:28px;border:1px dashed var(--border-dashed)"></div></div>
</div>
</body>
</html>
