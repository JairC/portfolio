<!-- @dsCard group="Colors" viewport="700x150" name="Paper & plates" subtitle="Card, page, hover and image surfaces" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-card);color:var(--text-primary);font-family:var(--font-mono);padding:20px 24px;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;width:104px}
.chip{height:52px}
.k{font-size:9px;line-height:12px;letter-spacing:.06em;color:var(--text-meta)}
.v{font-size:9px;line-height:12px;color:var(--text-muted)}
</style></head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:var(--paper);box-shadow:inset 0 0 0 1px rgba(14,14,12,.08)"></div><div class="k">PAPER</div><div class="v">--paper<br>#EDECEA</div></div>
<div class="sw"><div class="chip" style="background:var(--paper-shade);box-shadow:inset 0 0 0 1px rgba(14,14,12,.08)"></div><div class="k">PAPER SHADE</div><div class="v">--paper-shade<br>#E4E2DF</div></div>
<div class="sw"><div class="chip" style="background:var(--page);box-shadow:inset 0 0 0 1px rgba(14,14,12,.08)"></div><div class="k">PAGE</div><div class="v">--page<br>#DDDBD7</div></div>
<div class="sw"><div class="chip" style="background:var(--plate);box-shadow:inset 0 0 0 1px rgba(14,14,12,.08)"></div><div class="k">PLATE</div><div class="v">--plate<br>#D8D6D2</div></div>
</div>
</body>
</html>
